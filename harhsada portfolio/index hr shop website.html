      // Timer countdown
      useEffect(() => {
        const timer = setInterval(() => {
          setTimeLeft(t => {
            if (t.s > 0) return { ...t, s: t.s - 1 };
            if (t.m > 0) return { ...t, m: t.m - 1, s: 59 };
            if (t.h > 0) return { h: t.h - 1, m: 59, s: 59 };
            return { h: 12, m: 0, s: 0 };
          });
        }, 1000);
        return () => clearInterval(timer);
      }, []);

      // Auto banner switch
      useEffect(() => {
        const bTimer = setInterval(() => {
          setBannerIdx(i => (i + 1) % HERO_BANNERS.length);
        }, 5000);
        return () => clearInterval(bTimer);
      }, []);

      const showToast = (msg) => {
        setToast(msg);
        setTimeout(() => setToast(null), 3000);
      };

      // Cart Actions
      const addToCart = (prod) => {
        setCart(prev => {
          const ex = prev.find(i => i.id === prod.id);
          if (ex) {
            return prev.map(i => i.id === prod.id ? { ...i, qty: i.qty + 1 } : i);
          }
          return [...prev, { ...prod, qty: 1 }];
        });
        showToast(`Added "${prod.title.slice(0, 20)}..." to Cart! 🛒`);
      };

      const updateQty = (id, delta) => {
        setCart(prev => {
          return prev.map(item => {
            if (item.id === id) {
              const newQty = item.qty + delta;
              return newQty > 0 ? { ...item, qty: newQty } : null;
            }
            return item;
          }).filter(Boolean);
        });
      };

      const removeFromCart = (id) => {
        setCart(prev => prev.filter(i => i.id !== id));
        showToast("Removed from cart");
      };

      const toggleWishlist = (id) => {
        setWishlist(prev => {

            showToast("Added to Wishlist ❤️");
            return [...prev, id];
          }
        });
      };

      // Cart calculations
      const cartSummary = useMemo(() => {
        const totalItems = cart.reduce((s, i) => s + i.qty, 0);
        const subtotal = cart.reduce((s, i) => s + (i.price * i.qty), 0);
        const originalTotal = cart.reduce((s, i) => s + ((i.originalPrice || i.price) * i.qty), 0);
        const savings = originalTotal - subtotal;
        const delivery = subtotal > 500 || subtotal === 0 ? 0 : 49;
        return { totalItems, subtotal, originalTotal, savings, delivery, total: subtotal + delivery };
      }, [cart]);

      // Filter products
      const filtered = useMemo(() => {
        return products.filter(p => {
          if (selectedCat !== "all" && selectedCat !== "deals") {
            if (p.category.toLowerCase() !== selectedCat.toLowerCase()) return false;
          }
          if (selectedCat === "deals") {
            if (calculateDiscount(p.originalPrice, p.price) < 25) return false;
          }
          if (searchQuery.trim()) {
            const q = searchQuery.toLowerCase();
            if (!p.title.toLowerCase().includes(q) && !p.brand.toLowerCase().includes(q)) return false;
          }
          if (p.price > priceLimit) return false;
          if (minRating > 0 && p.rating < minRating) return false;
          if (onlyAssured && !p.assured) return false;
          return true;
        }).sort((a, b) => {
          if (sortBy === "price-low") return a.price - b.price;
          if (sortBy === "price-high") return b.price - a.price;
          if (sortBy === "rating") return b.rating - a.rating;
          if (sortBy === "discount") {
            return calculateDiscount(b.originalPrice, b.price) - calculateDiscount(a.originalPrice, a.price);
          }
          return 0;
        });
      }, [products, selectedCat, searchQuery, priceLimit, minRating, onlyAssured, sortBy]);

      return (
        <div className="min-h-screen flex flex-col bg-[#f1f3f6]">
          {/* Toast */}
          {toast && (
            <div className="fixed bottom-6 right-6 z-[1000] bg-slate-900 text-white px-5 py-3 rounded-xl shadow-2xl text-xs font-bold border border-slate-700 flex items-center gap-2">
              <span className="w-2 h-2 rounded-full bg-emerald-400"></span>
              <span>{toast}</span>
            </div>
          )}

          {/* 1. TOP NAVBAR (Amazon/Flipkart) */}
          <header className="sticky top-0 z-50 bg-[#131921] text-white shadow-md">
            <div className="max-w-[1400px] mx-auto px-4 py-2.5 flex items-center justify-between gap-4">
              
              {/* Logo */}
              <div className="flex items-center gap-3">
                <button onClick={() => { setSelectedCat("all"); setSearchQuery(""); }} className="flex items-center gap-2 text-left">
                  <div className="w-10 h-10 rounded-lg bg-gradient-to-tr from-blue-600 via-blue-500 to-amber-400 flex items-center justify-center font-black text-xl text-white shadow">
                    S
                  </div>
                  <div>
                    <div className="text-xl font-extrabold flex items-center">
                      Shop<span className="text-[#ffe11b]">Kart</span>
                      <span className="text-[10px] ml-1 px-1 bg-[#ff9f00] text-slate-900 font-black rounded">PLUS</span>
                    </div>
                    <div className="text-[10px] text-amber-300 italic">Explore Mega Deals</div>
                  </div>
                </button>
              </div>

              {/* Search Bar */}
              <div className="flex-1 max-w-2xl">
                <div className="flex rounded-md overflow-hidden bg-white border-2 border-transparent focus-within:border-[#ff9f00]">
                  <input
                    type="text"
                    value={searchQuery}
                    onChange={(e) => setSearchQuery(e.target.value)}
                    placeholder="Search for iPhone, Sony, Nike, Laptops..."
                    className="w-full px-4 py-2 text-xs sm:text-sm text-slate-900 outline-none"
                  />
                  {searchQuery && (
                    <button onClick={() => setSearchQuery("")} className="px-2 text-slate-400 hover:text-slate-600">
                      <Icon name="close" className="w-4 h-4" />
                    </button>
                  )}
                  <button className="bg-[#ff9f00] text-slate-900 px-5 flex items-center justify-center font-bold">
                    <Icon name="search" className="w-5 h-5" />
                  </button>
                </div>
              </div>

              {/* Right Action Icons */}
              <div className="flex items-center gap-2 sm:gap-4">
                {/* Currency */}
                <button
                  onClick={() => setCurrency(c => c === 'INR' ? 'USD' : 'INR')}
                  className="px-2.5 py-1 text-xs font-bold rounded border border-slate-700 text-amber-300 hover:bg-slate-800"
                >
                  {currency === 'INR' ? '₹ INR' : '$ USD'}
                </button>

                {/* Orders */}
                <button
                  onClick={() => setIsOrdersOpen(true)}
                  className="hidden md:flex flex-col text-left px-2 py-1 hover:border hover:border-slate-600 rounded"
                >
                  <span className="text-[10px] text-slate-400">Returns</span>
                  <span className="text-xs font-bold">
                    & Orders {orders.length > 0 && `(${orders.length})`}
                  </span>
                </button>

                {/* Wishlist */}
                <button
                  onClick={() => setIsWishlistOpen(true)}
                  className="relative p-2 rounded hover:bg-slate-800"
                  title="Wishlist"
                >
                  <Icon name="heart" className="w-6 h-6 text-white" />
                  {wishlist.length > 0 && (
                    <span className="absolute top-1 right-1 w-4 h-4 bg-rose-500 text-[10px] font-bold rounded-full flex items-center justify-center">
                      {wishlist.length}
                    </span>
                  )}
                </button>

                {/* Cart Button */}
                <button
                  onClick={() => setIsCartOpen(true)}
                  className="flex items-center gap-2 bg-[#ff9f00] hover:bg-amber-500 text-slate-950 font-extrabold px-3.5 py-2 rounded-md shadow"
                >
                  <div className="relative">
                    <Icon name="cart" className="w-5 h-5" />
                    {cartSummary.totalItems > 0 && (
                      <span className="absolute -top-2 -right-2 bg-slate-950 text-white text-[10px] w-4 h-4 rounded-full flex items-center justify-center">
                        {cartSummary.totalItems}
                      </span>
                    )}
                  </div>
                  <span className="text-xs font-black hidden sm:inline">Cart</span>
                  {cartSummary.total > 0 && (
                    <span className="text-xs bg-slate-900 text-amber-300 px-1.5 py-0.5 rounded font-mono hidden lg:inline">
                      {formatCurrency(cartSummary.total, currency)}
                    </span>
                  )}
                </button>
              </div>

            </div>

            {/* Sub-navbar categories */}
            <div className="bg-[#232f3e] border-t border-slate-700/60 text-xs font-semibold">
              <div className="max-w-[1400px] mx-auto px-4 py-2 flex items-center gap-2 overflow-x-auto no-scrollbar">
                {NAV_CATEGORIES.map(cat => (
                  <button
                    key={cat.id}
                    onClick={() => { setSelectedCat(cat.id); setSearchQuery(""); }}
                    className={`px-3 py-1 rounded whitespace-nowrap transition-colors ${
                      selectedCat === cat.id ? "bg-[#2874f0] text-white font-bold" : "text-slate-200 hover:bg-slate-700"

                  </button>

              </div>
            </div>
          </header>

                </button>
              </div>
            </section>

                <span className="flex items-center gap-1.5"><Icon name="truck" className="w-4 h-4 text-blue-600" /> Free & Fast Delivery</span>
                <span className="flex items-center gap-1.5"><Icon name="shield" className="w-4 h-4 text-emerald-600" /> 100% Genuine Assured</span>
                <span className="flex items-center gap-1.5"><Icon name="refresh" className="w-4 h-4 text-amber-600" /> 7-Day Easy Returns</span>

                </div>

                {/* Categories */}
                <div>
                  <h4 className="text-xs font-bold text-slate-500 uppercase mb-2">Category</h4>

                        className={`w-full text-left px-2 py-1.5 rounded font-medium ${
                          selectedCat === c.id ? "bg-blue-50 text-blue-700 font-bold" : "text-slate-600 hover:bg-slate-50"
                        }`}
                      >
                        {c.name}
                      </button>
                    ))}
                  </div>
                </div>

                {/* Assured Check */}
                <div className="pt-3 border-t border-slate-100">
                  <label className="flex items-center gap-2 cursor-pointer text-xs">
                    <input
                      type="checkbox"
                      checked={onlyAssured}
                      onChange={e => setOnlyAssured(e.target.checked)}
                      className="w-4 h-4 rounded text-blue-600"
                    />
                    <span className="badge-assured">ShopKart <span className="plus">Assured ✓</span></span>
                  </label>
                </div>

                {/* Max Price Slider */}
                <div className="pt-3 border-t border-slate-100">
                  <div className="flex justify-between text-xs font-bold mb-1">
                    <span className="text-slate-500">Max Budget</span>
                    <span className="text-blue-600 font-mono">{formatCurrency(priceLimit, currency)}</span>
                  </div>
                  <input
                    type="range"
                    min="3000"
                    max="200000"
                    step="5000"
                    value={priceLimit}
                    onChange={e => setPriceLimit(Number(e.target.value))}
                    className="w-full h-1.5 bg-slate-200 rounded cursor-pointer accent-blue-600"
                  />
                </div>

                {/* Rating Filter */}
                <div className="pt-3 border-t border-slate-100">
                  <h4 className="text-xs font-bold text-slate-500 uppercase mb-2">Customer Rating</h4>
                  <div className="space-y-1 text-xs">
                    {[4, 3].map(r => (
                      <button
                        key={r}
                        onClick={() => setMinRating(prev => prev === r ? 0 : r)}
                        className={`w-full text-left px-2 py-1 rounded flex items-center justify-between ${
                          minRating === r ? "bg-amber-50 font-bold text-amber-900" : "text-slate-600 hover:bg-slate-50"
                        }`}
                      >
                        <span className="rating-badge text-[11px]">{r}★ & above</span>
                        {minRating === r && <span>✓</span>}
                      </button>
                    ))}
                  </div>
                </div>
              </aside>

              {/* Product Grid */}
              <div className="flex-1 min-w-0">
                
                {/* Header bar */}
                <div className="bg-white p-3.5 rounded-xl border border-slate-200 shadow-xs mb-4 flex flex-wrap items-center justify-between gap-3 text-xs">
                  <div>
                    <span className="font-bold text-slate-800 text-sm">
                      {selectedCat === "all" ? "All Products" : selectedCat}
                    </span>
                    <span className="text-slate-500 ml-2">({filtered.length} items found)</span>
                  </div>
                  <div className="flex items-center gap-1.5">
                    <span className="text-slate-500 font-medium">Sort By:</span>
                    {["featured", "price-low", "price-high", "rating", "discount"].map(s => (
                      <button
                        key={s}
                        onClick={() => setSortBy(s)}
                        className={`px-2.5 py-1 rounded font-medium ${
                          sortBy === s ? "bg-blue-600 text-white font-bold" : "bg-slate-100 text-slate-700 hover:bg-slate-200"
                        }`}
                      >
                        {s === "featured" && "Featured"}
                        {s === "price-low" && "Price ↑"}
                        {s === "price-high" && "Price ↓"}
                        {s === "rating" && "Rating"}
                        {s === "discount" && "Discount"}
                      </button>
                    ))}
                  </div>
                </div>

                {/* Cards */}
                {filtered.length === 0 ? (
                  <div className="bg-white rounded-xl p-12 text-center border border-slate-200">
                    <p className="text-base font-bold text-slate-700 mb-2">No matching products found</p>
                    <button
                      onClick={() => { setSelectedCat("all"); setSearchQuery(""); setPriceLimit(200000); }}
                      className="bg-blue-600 text-white text-xs font-bold px-4 py-2 rounded"
                    >
                      Reset Filters
                    </button>
                  </div>
                ) : (
                  <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                    {filtered.map(p => {
                      const disc = calculateDiscount(p.originalPrice, p.price);
                      const inWishlist = wishlist.includes(p.id);
                      const inCart = cart.find(i => i.id === p.id);

                      return (
                        <div key={p.id} className="product-card group">
                          {/* Discount & Wishlist */}
                          <div className="absolute top-2.5 left-2.5 right-2.5 flex justify-between items-center z-10 pointer-events-none">
                            {disc > 0 ? (
                              <span className="bg-[#388e3c] text-white text-[11px] font-extrabold px-2 py-0.5 rounded shadow">
                                {disc}% OFF
                              </span>
                            ) : <span></span>}
                            <button
                              onClick={() => toggleWishlist(p.id)}
                              className="pointer-events-auto w-8 h-8 rounded-full bg-white/90 hover:bg-white text-slate-600 hover:text-red-500 shadow flex items-center justify-center transition-transform active:scale-90"
                            >
                              <Icon name={inWishlist ? "heart-filled" : "heart"} className="w-4 h-4" />
                            </button>
                          </div>

                          {/* Image */}
                          <div onClick={() => setSelectedProduct(p)} className="img-box cursor-pointer">
                            <img src={p.image} alt={p.title} loading="lazy" />
                          </div>

                          {/* Content */}
                          <div className="p-4 flex flex-col flex-1">
                            <div className="flex items-center gap-2 mb-1">
                              <span className="text-[10px] font-bold text-slate-500 uppercase">{p.brand}</span>
                              {p.assured && (
                                <span className="badge-assured">ShopKart <span className="plus">Assured ✓</span></span>
                              )}
                            </div>

                            <h3
                              onClick={() => setSelectedProduct(p)}
                              className="text-xs font-bold text-slate-800 line-clamp-2 hover:text-blue-600 cursor-pointer mb-2"

                              {p.title}
                            </h3>

                            <div className="flex items-center gap-2 mb-3">
                              <span className="rating-badge">{p.rating} ★</span>
                              <span className="text-[11px] text-slate-400">({p.reviewsCount.toLocaleString()})</span>
                            </div>

                            {/* Price */}
                            <div className="mt-auto pt-2 border-t border-slate-100">
                              <div className="flex items-baseline gap-2 font-mono">
                                <span className="text-base font-extrabold text-slate-900">
                                  {formatCurrency(p.price, currency)}
                                </span>
                                {p.originalPrice > p.price && (
                                  <span className="text-xs text-slate-400 line-through">
                                    {formatCurrency(p.originalPrice, currency)}
                                  </span>
                                )}
                              </div>
                              <div className="text-[10px] text-emerald-600 font-bold mt-0.5">

                              </div>

                              {/* Buttons */}
                              <div className="mt-3 grid grid-cols-2 gap-2">
                                {inCart ? (
                                  <div className="flex items-center justify-between border-2 border-[#ff9f00] rounded px-2 py-1 bg-amber-50">

                                    <span className="text-xs font-bold font-mono">{inCart.qty}</span>
                                    <button onClick={() => updateQty(p.id, 1)} className="w-5 h-5 bg-[#ff9f00] font-black rounded text-xs flex items-center justify-center">+</button>
                                  </div>

                  {cart.length === 0 ? (
                    <div className="text-center py-16 text-slate-500">
                      <p className="font-bold text-lg mb-2">Your Cart is Empty!</p>
                      <button onClick={() => setIsCartOpen(false)} className="bg-blue-600 text-white font-bold px-4 py-2 rounded text-xs">
                        Start Shopping
                      </button>
                    </div>
                  ) : (
                    <>
                      {cart.map(item => (
                        <div key={item.id} className="p-3 rounded-lg border border-slate-200 flex gap-3">
                          <img src={item.image} alt={item.title} className="w-16 h-16 object-contain p-1 bg-slate-50 rounded" />
                          <div className="flex-1 min-w-0">
                            <h4 className="text-xs font-bold text-slate-800 line-clamp-1">{item.title}</h4>
                            <div className="text-xs font-mono font-bold text-slate-900 my-1">
                              {formatCurrency(item.price * item.qty, currency)}
                            </div>
                            <div className="flex items-center justify-between">
                              <div className="flex items-center border rounded">
                                <button onClick={() => updateQty(item.id, -1)} className="px-2 py-0.5 text-xs font-bold hover:bg-slate-100">-</button>
                                <span className="px-2 text-xs font-bold font-mono">{item.qty}</span>
                                <button onClick={() => updateQty(item.id, 1)} className="px-2 py-0.5 text-xs font-bold hover:bg-slate-100">+</button>
                              </div>
                              <button onClick={() => removeFromCart(item.id)} className="text-red-500 text-xs flex items-center gap-1">
                                <Icon name="trash" className="w-3.5 h-3.5" /> Remove
                              </button>
                            </div>
                          </div>
                        </div>
                      ))}

                      {/* Summary */}
                      <div className="bg-slate-50 p-4 rounded-xl border border-slate-200 text-xs space-y-2">
                        <div className="flex justify-between text-slate-600">
                          <span>Subtotal</span>
                          <span className="font-mono">{formatCurrency(cartSummary.subtotal, currency)}</span>
                        </div>
                        {cartSummary.savings > 0 && (
                          <div className="flex justify-between text-emerald-600 font-semibold">
                            <span>You Save</span>
                            <span className="font-mono">- {formatCurrency(cartSummary.savings, currency)}</span>
                          </div>
                        )}
                        <div className="flex justify-between text-slate-600">
                          <span>Delivery</span>
                          <span className="font-bold text-emerald-600">FREE</span>
                        </div>
                        <div className="pt-2 border-t flex justify-between font-bold text-sm text-slate-900">
                          <span>Total Amount</span>
                          <span className="font-mono text-base text-blue-600">{formatCurrency(cartSummary.total, currency)}</span>
                        </div>
                      </div>
                    </>
                  )}
                </div>

                {cart.length > 0 && (
                  <div className="p-4 border-t">
                    <button
                      onClick={() => { setIsCartOpen(false); setIsCheckoutOpen(true); }}
                      className="w-full bg-[#fb641b] text-white font-bold py-3 rounded-lg text-xs shadow flex items-center justify-center gap-2"
                    >
                      <Icon name="zap" className="w-4 h-4" />
                      Proceed to Checkout ({formatCurrency(cartSummary.total, currency)})
                    </button>
                  </div>
                )}
              </div>
            </div>
          )}

          {/* 7. CHECKOUT MODAL */}
          {isCheckoutOpen && (
            <div className="modal-backdrop" onClick={() => setIsCheckoutOpen(false)}>
              <div className="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl relative" onClick={e => e.stopPropagation()}>
                <button onClick={() => setIsCheckoutOpen(false)} className="absolute top-4 right-4 text-slate-400 hover:text-slate-600">
                  <Icon name="close" className="w-4 h-4" />
                </button>
                <h3 className="text-base font-bold text-slate-800 mb-1">Confirm & Place Order</h3>
                <p className="text-xs text-slate-500 mb-4">Complete simulated checkout</p>
                <form
                  onSubmit={(e) => {
                    e.preventDefault();
                    const order = {
                      id: `SK-${Math.floor(100000 + Math.random() * 900000)}`,
                      date: new Date().toLocaleDateString(),
                      total: cartSummary.total,
                      itemsCount: cartSummary.totalItems
                    };
                    setOrders(prev => [order, ...prev]);
                    setCart([]);
                    setIsCheckoutOpen(false);
                    showToast("Order placed successfully! Check Orders tab. 🎉");
                  }}
                  className="space-y-3 text-xs"
                >
                  <div>
                    <label className="block text-slate-600 font-semibold mb-1">Full Name</label>
                    <input type="text" defaultValue="Harshada Desai" required className="w-full px-3 py-2 border rounded" />
                  </div>
                  <div>
                    <label className="block text-slate-600 font-semibold mb-1">Delivery Address</label>
                    <input type="text" defaultValue="Marine Drive, Mumbai - 400001" required className="w-full px-3 py-2 border rounded" />
                  </div>
                  <div>
                    <label className="block text-slate-600 font-semibold mb-1">Payment Method</label>
                    <select className="w-full px-3 py-2 border rounded bg-white font-medium">
                      <option>UPI / Google Pay / PhonePe</option>
                      <option>Credit / Debit Card</option>
                      <option>Cash on Delivery (COD)</option>
                    </select>
                  </div>
                  <div className="p-3 bg-slate-50 rounded font-bold flex justify-between items-center text-slate-800">
                    <span>Payable:</span>
                    <span className="font-mono text-blue-600 text-sm">{formatCurrency(cartSummary.total, currency)}</span>
                  </div>
                  <button type="submit" className="w-full bg-[#fb641b] text-white font-bold py-2.5 rounded-lg text-xs shadow">
                    Place Order Now
                  </button>
                </form>
              </div>
            </div>
          )}

          {/* 8. WISHLIST MODAL */}
          {isWishlistOpen && (
            <div className="modal-backdrop" onClick={() => setIsWishlistOpen(false)}>
              <div className="bg-white rounded-2xl max-w-lg w-full p-6 shadow-2xl relative" onClick={e => e.stopPropagation()}>
                <button onClick={() => setIsWishlistOpen(false)} className="absolute top-4 right-4 text-slate-400">
                  <Icon name="close" className="w-4 h-4" />
                </button>
                <h3 className="text-base font-bold text-slate-800 mb-4 flex items-center gap-2">
                  <Icon name="heart-filled" className="w-5 h-5 text-red-500" />
                  My Wishlist ({wishlist.length})
                </h3>
                <div className="space-y-3 max-h-80 overflow-y-auto">
                  {wishlist.length === 0 ? (
                    <p className="text-xs text-slate-500 text-center py-8">Wishlist is empty.</p>
                  ) : (
                    wishlist.map(id => {
                      const item = products.find(p => p.id === id);
                      if (!item) return null;
                      return (
                        <div key={item.id} className="flex items-center justify-between p-2.5 border rounded-lg bg-slate-50">
                          <div className="flex items-center gap-3">
                            <img src={item.image} alt={item.title} className="w-12 h-12 object-contain" />
                            <div>
                              <div className="text-xs font-bold line-clamp-1">{item.title}</div>
                              <div className="text-xs font-mono font-bold text-blue-600">{formatCurrency(item.price, currency)}</div>
                            </div>
                          </div>
                          <button
                            onClick={() => { addToCart(item); toggleWishlist(item.id); }}
                            className="bg-[#ff9f00] text-slate-950 font-bold px-3 py-1 rounded text-xs"
                          >
                            Move to Cart
                          </button>
                        </div>
                      );
                    })
                  )}
                </div>
              </div>
            </div>
          )}

          {/* 9. ORDERS MODAL */}
          {isOrdersOpen && (
            <div className="modal-backdrop" onClick={() => setIsOrdersOpen(false)}>
              <div className="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl relative" onClick={e => e.stopPropagation()}>
                <button onClick={() => setIsOrdersOpen(false)} className="absolute top-4 right-4 text-slate-400">
                  <Icon name="close" className="w-4 h-4" />
                </button>
                <h3 className="text-base font-bold text-slate-800 mb-4">My Orders ({orders.length})</h3>
                <div className="space-y-3 max-h-80 overflow-y-auto">
                  {orders.length === 0 ? (
                    <p className="text-xs text-slate-500 text-center py-8">No past orders yet.</p>
                  ) : (
                    orders.map(o => (
                      <div key={o.id} className="p-3 border rounded-lg bg-slate-50 text-xs space-y-1">
                        <div className="flex justify-between font-bold">
                          <span className="text-blue-600">{o.id}</span>
                          <span className="text-slate-500">{o.date}</span>
                        </div>
                        <div className="flex justify-between text-slate-600">
                          <span>Items: {o.itemsCount}</span>
                          <span className="font-mono font-bold text-slate-900">{formatCurrency(o.total, currency)}</span>
                        </div>
                        <div className="text-emerald-600 font-bold text-[11px]">✓ Confirmed - Out for Delivery</div>
                      </div>
                    ))
                  )}
                </div>
              </div>
            </div>
          )}

          {/* 10. FOOTER */}
          <footer className="bg-[#131921] text-slate-300 text-xs mt-12 py-8 border-t border-slate-800">
            <div className="max-w-[1400px] mx-auto px-4 text-center space-y-2">
              <div className="text-base font-extrabold text-white">
                Shop<span className="text-[#ffe11b]">Kart</span>
              </div>
              <p className="text-slate-400">Modern E-Commerce Store inspired by Amazon & Flipkart</p>
              <p className="text-slate-500 text-[11px]">Built with HTML5, CSS3, JavaScript, and React 18</p>
            </div>
          </footer>

        </div>
      );
    }

    // Render the React App into the DOM
    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
